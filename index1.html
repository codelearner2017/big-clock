<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Night Clock</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
background-color: #000000;
color: #b0b0b0; /* Soft dim gray to prevent glare at night */
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, He
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
height: 100vh;
width: 100vw;
overflow: hidden;
user-select: none;
}
#clock {
font-size: 26vw;
font-weight: 700;
line-height: 1;
letter-spacing: -0.03em;
}
#ampm {
font-size: 6vw;
font-weight: 400;
margin-left: 1vw;
color: #707070;
}
#status {
position: fixed;
bottom: 18px;
font-size: 16px;
color: #555555;
transition: opacity 1s ease;
}
</style>
</head>
<body>
<div>
</div>
<span id="clock">12:00</span><span id="ampm">AM</span>
<div id="status">Tap screen once to lock awake mode</div>
<script>
// Update the clock every second
function updateClock() {
const now = new Date();
let hours = now.getHours();
const minutes = String(now.getMinutes()).padStart(2, '0');
const ampm = hours >= 12 ? 'PM' : 'AM';
hours = hours % 12;
hours = hours ? hours : 12;
document.getElementById('clock').textContent = hours + ':' + minute
document.getElementById('ampm').textContent = ampm;
}
setInterval(updateClock, 1000);
updateClock();
// Keep-awake silent audio loop for Amazon Silk browser
let audioCtx;
function keepAwake() {
if (!audioCtx) {
const AudioContext = window.AudioContext || window.webkitAudioCont
audioCtx = new AudioContext();
const oscillator = audioCtx.createOscillator();const gainNode = audioCtx.createGain();
gainNode.gain.value = 0.001; // Practically silent
oscillator.connect(gainNode);
gainNode.connect(audioCtx.destination);
oscillator.start();
const status = document.getElementById('status');
status.textContent = 'Awake lock active';
setTimeout(() => { status.style.opacity = '0'; }, 3000);
}
if (document.documentElement.requestFullscreen && !document.fullscre
document.documentElement.requestFullscreen().catch(() => {});
}
}
document.body.addEventListener('click', keepAwake);
document.body.addEventListener('touchstart', keepAwake);
</script>
</body>
</html>
