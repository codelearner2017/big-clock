
 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Large Digital Clock</title>
<style>
  html, body {
  margin: 0;
  padding: 0;
  height: 100%;
}

.large-clock-container {
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  box-sizing: border-box;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background-color: #111827; /* Dark background */
  color: #FF0000;            /* Crisp white text is code #f9fafb */
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  padding: 3rem 1.5rem;
  border-radius: 0;
  text-align: center;
}

#clock-time {
    /* Scales smoothly from 3.5rem on mobile up to 9rem on large screens */
    font-size: clamp(3.5rem, 18vw, 16rem); /* changed from 18vw and 16 rem */
    font-weight: 800;
    line-height: 2.1; /* changed from 1.1 to 2.1 */
    letter-spacing: 0.04em;
    /* Keeps numbers the exact same width so the clock doesn't jitter every second */
    font-variant-numeric: tabular-nums;
  }

  #clock-date {
    font-size: clamp(1rem, 2.5vw, 1.75rem);
    color: #9ca3af;
    margin-top: 0.75rem;
    font-weight: 500;
  }

</style>
</head>

<body>
<title>Echo Show Full Screen</title>
  <style>
    /* Ensure the page fills the screen cleanly in full-screen mode */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #111;
      color: #fff;
      font-family: sans-serif;
    }

    /* Floating button in the bottom-right corner */
    #fs-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 9999;
      padding: 12px 18px;
      font-size: 16px;
      font-weight: bold;
      color: #ffffff;
      background-color: rgba(0, 120, 215, 0.85);
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

 

  <!-- Full Screen Trigger Button -->
  <button id="fs-btn" onclick="goFullScreen()">⛶ Full Screen</button>

  <script>
    const fsBtn = document.getElementById('fs-btn');

    function goFullScreen() {
      const elem = document.documentElement;
      if (elem.requestFullscreen) {
        elem.requestFullscreen();
      } else if (elem.webkitRequestFullscreen) { /* Fallback for older WebKit/Silk versions */
        elem.webkitRequestFullscreen();
      }
    }

    // Automatically hide the button when full screen is active, and show it again if you exit
    function handleFullscreenChange() {
      if (document.fullscreenElement || document.webkitFullscreenElement) {
        fsBtn.style.display = 'none';
      } else {
        fsBtn.style.display = 'block';
      }
    }

    document.addEventListener('fullscreenchange', handleFullscreenChange);
    document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
  </script>

</body>
</html>

<body>

  <!-- Copy from here down if pasting into an existing webpage -->
  <div class="large-clock-container">
    <div id="clock-time">00:00:00</div> 
    <div id="clock-date">Loading date...</div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();

      // Format Time (Change hour12 to false for 24-hour military time)
      const timeString = now.toLocaleTimeString('en-US', {
        hour: '2-digit',
        minute: '2-digit',
      // remove forward slants and text to show seconds  second: '2-digit',
        hour12: true
      });

      // Format Date
      const dateString = now.toLocaleDateString('en-US', {
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      });

      document.getElementById('clock-time').textContent = timeString;
      document.getElementById('clock-date').textContent = dateString;
    }

    // Run immediately so there is no 1-second delay on page load, then update every second
    updateClock();
    setInterval(updateClock, 1000);
  </script>

</body>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      background-color: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #keep-open-btn {
      padding: 8px 16px;
      font-size: 14px;
      font-family: sans-serif;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- One-time tap required by Silk's autoplay security policy -->
  <button id="keep-open-btn" onclick="keepSilkOpen()">Keep Screen Open</button>

  <!-- Embedded silent WAV audio on a continuous loop -->
  <audio id="silent-audio" loop>
    <source src="data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA" type="audio/wav">
  </audio>

  <script>
    function keepSilkOpen() {
      const audio = document.getElementById('silent-audio');
      const btn = document.getElementById('keep-open-btn');
      
      audio.play().then(() => {
        // Hides the button once active
        btn.style.display = 'none';
      }).catch((error) => {
        console.error("Playback failed:", error);
      });
    }
  </script>

</body>
